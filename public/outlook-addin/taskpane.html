<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LEAP — Log Email</title>
  <link rel="icon" href="assets/icon-32.png"/>
  <!-- Office.js: required, served from Microsoft's CDN (the one external
       dependency every Outlook add-in loads). -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- Supabase JS (UMD global `supabase`), pinned major version. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="taskpane.css"/>
</head>
<body>
  <div id="app">
    <header class="lp-topbar">
      <img src="assets/icon-32.png" alt="LEAP" width="22" height="22"/>
      <span class="lp-title">Log Email to LEAP</span>
      <button id="signOutBtn" class="lp-link" type="button" hidden>Sign out</button>
    </header>

    <!-- Loading / host gate -->
    <section id="bootView" class="lp-view">
      <p class="lp-muted">Loading…</p>
    </section>

    <!-- Not-in-Outlook fallback -->
    <section id="unsupportedView" class="lp-view" hidden>
      <p class="lp-muted">This page is the LEAP “Log Email” Outlook add-in. Open it from the <strong>Log to LEAP</strong> button on an email in Outlook.</p>
    </section>

    <!-- Sign-in -->
    <section id="loginView" class="lp-view" hidden>
      <p class="lp-muted">Sign in with your LEAP account to log this email.</p>
      <form id="loginForm">
        <label class="lp-label" for="email">Email</label>
        <input class="lp-input" id="email" type="email" autocomplete="username" required/>
        <label class="lp-label" for="password">Password</label>
        <input class="lp-input" id="password" type="password" autocomplete="current-password" required/>
        <button class="lp-btn lp-btn-primary" id="loginBtn" type="submit">Sign in</button>
        <p id="loginError" class="lp-error" hidden></p>
      </form>
    </section>

    <!-- Main -->
    <section id="mainView" class="lp-view" hidden>
      <div class="lp-card lp-email-summary">
        <div class="lp-email-line"><span class="lp-email-key">From</span><span id="emFrom" class="lp-email-val"></span></div>
        <div class="lp-email-line"><span class="lp-email-key">Subject</span><span id="emSubject" class="lp-email-val"></span></div>
        <div class="lp-email-line"><span class="lp-email-key">Direction</span><span id="emDirection" class="lp-email-val"></span></div>
      </div>

      <label class="lp-label" for="objectType">Log to</label>
      <select class="lp-input" id="objectType">
        <option value="opportunities">Opportunity</option>
        <option value="properties">Property</option>
        <option value="accounts">Account</option>
        <option value="contacts">Contact</option>
        <option value="projects">Project</option>
        <option value="work_orders">Work Order</option>
      </select>

      <label class="lp-label" for="search">Find the record</label>
      <input class="lp-input" id="search" type="text" placeholder="Search by name or record number…" autocomplete="off"/>
      <ul id="results" class="lp-results"></ul>

      <div id="selectedBar" class="lp-selected" hidden>
        <span class="lp-selected-label">Selected:</span>
        <span id="selectedName" class="lp-selected-name"></span>
      </div>

      <label class="lp-check" id="attachRow" hidden>
        <input type="checkbox" id="includeAttachments" checked/>
        <span>Include attachments (<span id="attachCount">0</span>)</span>
      </label>

      <button class="lp-btn lp-btn-primary" id="logBtn" type="button" disabled>Log Email</button>
      <p id="statusMsg" class="lp-status" hidden></p>
    </section>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
