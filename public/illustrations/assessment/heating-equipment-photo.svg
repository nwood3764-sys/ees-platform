<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Inter, -apple-system, sans-serif">
  <!-- Heating System — full equipment photo guide. Realistic style: metallic
       gradients, cast shadows, true furnace anatomy. Callouts preserved. -->
  <defs>
    <linearGradient id="hcab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aab6c8"/><stop offset="0.18" stop-color="#e8edf4"/>
      <stop offset="0.55" stop-color="#f6f8fb"/><stop offset="0.85" stop-color="#d5dde8"/>
      <stop offset="1" stop-color="#b3bfd0"/>
    </linearGradient>
    <linearGradient id="hduct" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf3"/><stop offset="0.5" stop-color="#c3ccd9"/>
      <stop offset="1" stop-color="#9fabbd"/>
    </linearGradient>
    <linearGradient id="hductv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fabbd"/><stop offset="0.4" stop-color="#dde3ec"/>
      <stop offset="1" stop-color="#aeb9c9"/>
    </linearGradient>
    <linearGradient id="hflue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e99a9"/><stop offset="0.45" stop-color="#e4e8ee"/>
      <stop offset="1" stop-color="#98a3b3"/>
    </linearGradient>
    <linearGradient id="hwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2efe8"/><stop offset="1" stop-color="#e4dfd2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- room -->
  <rect x="0" y="0" width="480" height="560" fill="url(#hwall)"/>
  <rect x="0" y="468" width="480" height="92" fill="#d9d2c1"/>
  <rect x="0" y="468" width="480" height="8" fill="#c4bca7"/>
  <!-- concrete floor joints -->
  <path d="M60 560 L120 468 M300 560 L280 468 M470 548 L420 468" stroke="#c8c0ab" stroke-width="2" fill="none"/>

  <!-- cast shadow -->
  <ellipse cx="235" cy="474" rx="160" ry="14" fill="#8d8468" opacity="0.35" filter="url(#soft)"/>

  <!-- trunk duct -->
  <rect x="88" y="84" width="336" height="48" fill="url(#hduct)" stroke="#6a7788" stroke-width="2"/>
  <rect x="88" y="84" width="336" height="8" fill="#f2f5f9" opacity="0.8"/>
  <g stroke="#8894a5" stroke-width="1.6"><line x1="152" y1="84" x2="152" y2="132"/><line x1="230" y1="84" x2="230" y2="132"/><line x1="308" y1="84" x2="308" y2="132"/><line x1="378" y1="84" x2="378" y2="132"/></g>
  <!-- branch takeoff -->
  <rect x="360" y="132" width="46" height="72" fill="url(#hductv)" stroke="#6a7788" stroke-width="2"/>

  <!-- supply plenum (tapered) -->
  <path d="M168 132 L292 132 L280 198 L180 198 Z" fill="url(#hductv)" stroke="#6a7788" stroke-width="2"/>

  <!-- flue: round pipe with elbow into masonry chimney hint -->
  <path d="M298 196 L298 118 Q298 100 316 100 L354 100" fill="none" stroke="#6a7788" stroke-width="2"/>
  <path d="M320 196 L320 128 Q320 122 330 122 L354 122" fill="none" stroke="#6a7788" stroke-width="2"/>
  <path d="M298 196 L298 118 Q298 100 316 100 L354 100 L354 122 L330 122 Q320 122 320 128 L320 196 Z" fill="url(#hflue)" opacity="0.95"/>
  <rect x="354" y="86" width="34" height="48" fill="#cbb9a2" stroke="#9a8a72" stroke-width="2"/>
  <line x1="354" y1="102" x2="388" y2="102" stroke="#9a8a72" stroke-width="1.5"/>
  <line x1="354" y1="118" x2="388" y2="118" stroke="#9a8a72" stroke-width="1.5"/>

  <!-- furnace cabinet -->
  <rect x="176" y="198" width="122" height="212" rx="7" fill="url(#hcab)" stroke="#4c5a6e" stroke-width="3"/>
  <!-- upper door (seamed) -->
  <rect x="188" y="214" width="98" height="72" rx="4" fill="#eef1f6" stroke="#8894a5" stroke-width="1.8"/>
  <rect x="188" y="214" width="98" height="10" fill="#dde3ec"/>
  <!-- louvered lower door -->
  <rect x="188" y="298" width="98" height="94" rx="4" fill="#eef1f6" stroke="#8894a5" stroke-width="1.8"/>
  <g stroke="#c2cad6" stroke-width="3"><line x1="198" y1="376" x2="276" y2="376"/><line x1="198" y1="366" x2="276" y2="366"/></g>
  <!-- sight glass with burner glow -->
  <rect x="206" y="316" width="62" height="26" rx="4" fill="#3a3f4a"/>
  <ellipse cx="237" cy="330" rx="26" ry="9" fill="#f2b95b" opacity="0.9"/>
  <path d="M218 336 q4 -11 8 0 q4 -9 8 0 q4 -11 8 0 q4 -9 8 0" stroke="#ffd98a" stroke-width="2.5" fill="none"/>
  <!-- badge + label -->
  <rect x="228" y="230" width="40" height="12" rx="2" fill="#c9d2df"/>
  <circle cx="284" cy="352" r="4" fill="#4c5a6e"/>

  <!-- filter rack + return duct -->
  <rect x="106" y="198" width="48" height="212" fill="url(#hductv)" stroke="#6a7788" stroke-width="2"/>
  <rect x="154" y="330" width="22" height="60" fill="#b8c2d0" stroke="#6a7788" stroke-width="1.8"/>
  <g stroke="#8894a5" stroke-width="1.5"><line x1="106" y1="252" x2="154" y2="252"/><line x1="106" y1="306" x2="154" y2="306"/></g>

  <!-- gas line + yellow-brass valve, condensate line -->
  <path d="M176 372 L128 372 L128 452" stroke="#5f6c7f" stroke-width="5" fill="none"/>
  <rect x="118" y="396" width="20" height="14" rx="3" fill="#e8bf63" stroke="#9a7a2c" stroke-width="1.8"/>
  <path d="M298 396 L330 396 L330 462" stroke="#f4f6f9" stroke-width="5" fill="none" opacity="0.95"/>
  <path d="M298 396 L330 396 L330 462" stroke="#9fabbd" stroke-width="5" fill="none" stroke-dasharray="1 0" opacity="0.35"/>

  <!-- capture frame -->
  <rect x="66" y="46" width="368" height="452" rx="14" fill="none" stroke="#3ecf8e" stroke-width="5" stroke-dasharray="14 10"/>

  <!-- callouts -->
  <g font-size="17" font-weight="700" fill="#0d1a2e" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="26" y="32">Stand back — fit ALL of this in one shot</text>
    <text x="342" y="176">Flue pipe</text>
    <text x="22" y="168">Ductwork</text>
    <text x="304" y="286">Whole furnace</text>
    <text x="24" y="446">Gas line &amp; valve</text>
    <text x="266" y="524">Include the floor and space around it</text>
  </g>
  <g stroke="#4a5e7a" stroke-width="2.5" fill="none">
    <path d="M94 158 q24 -20 44 -36"/>
    <path d="M348 168 q-14 -10 -24 -22"/>
    <path d="M332 278 q-22 10 -36 18"/>
    <path d="M100 438 q14 -24 24 -48"/>
    <path d="M296 514 q-28 -14 -48 -30"/>
  </g>

</svg>
