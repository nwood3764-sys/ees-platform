<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Inter, -apple-system, sans-serif">
  <!-- Heating System — full equipment photo guide. Colored illustrated style:
       soft fills + pencil-grain texture, explicit labeled callouts. Portrait
       proportions so it renders large on a phone. -->
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.10  0 0 0 0 0.18  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="480" height="560" fill="#ffffff"/>
  <!-- basement wall + floor, warm washes -->
  <rect x="0" y="0" width="480" height="470" fill="#f2f0ea"/>
  <rect x="0" y="470" width="480" height="90" fill="#e6e0d2"/>
  <line x1="0" y1="470" x2="480" y2="470" stroke="#b9b09c" stroke-width="3" filter="url(#pencil)"/>

  <g filter="url(#pencil)">
    <!-- trunk duct across the top -->
    <rect x="90" y="86" width="330" height="46" fill="#d3dded" stroke="#41597e" stroke-width="3"/>
    <rect x="90" y="86" width="330" height="12" fill="#bccbe2"/>
    <line x1="150" y1="86" x2="150" y2="132" stroke="#7d92b3" stroke-width="2"/>
    <line x1="230" y1="86" x2="230" y2="132" stroke="#7d92b3" stroke-width="2"/>
    <line x1="310" y1="86" x2="310" y2="132" stroke="#7d92b3" stroke-width="2"/>
    <!-- branch duct dropping right -->
    <rect x="356" y="132" width="44" height="70" fill="#d3dded" stroke="#41597e" stroke-width="3"/>

    <!-- supply plenum -->
    <path d="M170 132 L290 132 L278 196 L182 196 Z" fill="#c6d2e6" stroke="#41597e" stroke-width="3"/>

    <!-- flue pipe -->
    <rect x="296" y="70" width="20" height="150" fill="#c2cbd8" stroke="#41597e" stroke-width="3" transform="rotate(8 306 145)"/>

    <!-- furnace cabinet -->
    <rect x="172" y="196" width="120" height="204" rx="8" fill="#e3e9f3" stroke="#243b5e" stroke-width="4"/>
    <rect x="172" y="196" width="26" height="204" rx="8" fill="#cfd9e9"/>
    <rect x="192" y="214" width="84" height="66" rx="5" fill="#f4f7fb" stroke="#41597e" stroke-width="2.5"/>
    <rect x="192" y="296" width="84" height="84" rx="5" fill="#f4f7fb" stroke="#41597e" stroke-width="2.5"/>
    <!-- burner window with warm glow -->
    <rect x="206" y="322" width="56" height="22" rx="4" fill="#f6dfae" stroke="#b98a2e" stroke-width="2"/>
    <path d="M218 340 q4 -12 8 0 q4 -10 8 0 q4 -12 8 0" stroke="#e8a949" stroke-width="3" fill="none"/>
    <circle cx="284" cy="352" r="4.5" fill="#41597e"/>

    <!-- return duct on the left -->
    <rect x="104" y="196" width="46" height="204" fill="#d3dded" stroke="#41597e" stroke-width="3"/>
    <line x1="104" y1="252" x2="150" y2="252" stroke="#7d92b3" stroke-width="2"/>
    <line x1="104" y1="308" x2="150" y2="308" stroke="#7d92b3" stroke-width="2"/>
    <path d="M150 400 L172 400" stroke="#41597e" stroke-width="3"/>

    <!-- gas line + valve -->
    <line x1="172" y1="372" x2="120" y2="372" stroke="#5a6f8e" stroke-width="4"/>
    <circle cx="120" cy="372" r="9" fill="#f2c063" stroke="#8a6720" stroke-width="2.5"/>

    <!-- floor shadow -->
    <ellipse cx="232" cy="472" rx="150" ry="10" fill="#cfc6b2" opacity="0.7"/>
  </g>

  <!-- emerald capture frame: everything to include -->
  <rect x="66" y="46" width="368" height="452" rx="14" fill="none" stroke="#3ecf8e" stroke-width="5" stroke-dasharray="14 10"/>

  <!-- labeled callouts (white halo for legibility) -->
  <g font-size="17" font-weight="700" fill="#0d1a2e" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="26" y="34">Stand back — fit ALL of this in one shot</text>
    <text x="330" y="176">Flue pipe</text>
    <text x="24" y="170">Ductwork</text>
    <text x="300" y="300">Whole furnace</text>
    <text x="26" y="446">Gas line &amp; valve</text>
    <text x="270" y="524">Include the floor and space around it</text>
  </g>
  <g stroke="#4a5e7a" stroke-width="2.5" fill="none">
    <path d="M96 160 q22 -18 42 -34"/>
    <path d="M336 168 q-12 -6 -20 -16"/>
    <path d="M330 292 q-24 8 -40 16"/>
    <path d="M96 436 q10 -22 22 -50"/>
    <path d="M300 514 q-30 -12 -52 -26"/>
  </g>

  <!-- camera badge -->
  <g transform="translate(398,506)">
    <circle cx="26" cy="26" r="26" fill="#3ecf8e"/>
    <rect x="10" y="18" width="32" height="22" rx="4" fill="#ffffff"/>
    <circle cx="26" cy="29" r="7" fill="#3ecf8e"/>
    <rect x="20" y="13" width="12" height="7" rx="2" fill="#ffffff"/>
  </g>
</svg>
