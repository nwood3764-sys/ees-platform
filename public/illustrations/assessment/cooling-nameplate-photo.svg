<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Inter, -apple-system, sans-serif">
  <!-- Cooling nameplate photo guide — realistic style. The data plate is on the
       condenser's side/corner panel near the service valves. -->
  <defs>
    <linearGradient id="cn_cab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa7ba"/><stop offset="0.2" stop-color="#dfe5ee"/>
      <stop offset="0.55" stop-color="#f3f6fa"/><stop offset="1" stop-color="#a4b0c2"/>
    </linearGradient>
    <linearGradient id="cn_plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fd"/><stop offset="1" stop-color="#dfe9f5"/>
    </linearGradient>
    <filter id="cn_soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="480" height="560" fill="#ecf3ee"/>

  <!-- condenser, upper-left -->
  <ellipse cx="112" cy="252" rx="86" ry="8" fill="#5f7a5c" opacity="0.3" filter="url(#cn_soft)"/>
  <rect x="34" y="54" width="152" height="196" rx="9" fill="url(#cn_cab)" stroke="#44526a" stroke-width="3"/>
  <!-- top grille + fan -->
  <ellipse cx="110" cy="112" rx="52" ry="36" fill="#2f3742"/>
  <g stroke="#c9d1dd" stroke-width="2">
    <ellipse cx="110" cy="112" rx="52" ry="36" fill="none"/>
    <ellipse cx="110" cy="112" rx="34" ry="23" fill="none"/>
    <line x1="58" y1="112" x2="162" y2="112"/><line x1="110" y1="76" x2="110" y2="148"/>
  </g>
  <circle cx="110" cy="112" r="7" fill="#dde3ec" stroke="#8894a5" stroke-width="2"/>
  <!-- coil fins -->
  <rect x="42" y="166" width="136" height="76" fill="#8f9dad"/>
  <g stroke="#77869a" stroke-width="1.8">
    <line x1="50" y1="166" x2="50" y2="242"/><line x1="62" y1="166" x2="62" y2="242"/>
    <line x1="74" y1="166" x2="74" y2="242"/><line x1="86" y1="166" x2="86" y2="242"/>
    <line x1="98" y1="166" x2="98" y2="242"/><line x1="110" y1="166" x2="110" y2="242"/>
    <line x1="122" y1="166" x2="122" y2="242"/><line x1="134" y1="166" x2="134" y2="242"/>
    <line x1="146" y1="166" x2="146" y2="242"/><line x1="158" y1="166" x2="158" y2="242"/>
  </g>
  <!-- service corner panel with the plate, near the line connections -->
  <rect x="148" y="120" width="38" height="88" rx="4" fill="#dde3ec" stroke="#8894a5" stroke-width="2"/>
  <rect x="154" y="132" width="26" height="20" rx="2" fill="url(#cn_plate)" stroke="#2a6bb0" stroke-width="3"/>
  <path d="M186 196 Q206 194 218 194" stroke="#2e3540" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M186 210 Q206 209 218 209" stroke="#b98a52" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- magnifier -->
  <circle cx="216" cy="150" r="30" fill="#ffffff" opacity="0.35"/>
  <circle cx="216" cy="150" r="30" fill="none" stroke="#2a6bb0" stroke-width="5"/>
  <line x1="238" y1="172" x2="268" y2="204" stroke="#2a6bb0" stroke-width="7" stroke-linecap="round"/>

  <!-- zoomed data plate -->
  <rect x="72" y="272" width="338" height="238" rx="10" fill="url(#cn_plate)" stroke="#44526a" stroke-width="3"/>
  <circle cx="88" cy="288" r="4" fill="#aab6c8"/><circle cx="394" cy="288" r="4" fill="#aab6c8"/>
  <circle cx="88" cy="494" r="4" fill="#aab6c8"/><circle cx="394" cy="494" r="4" fill="#aab6c8"/>
  <rect x="86" y="284" width="180" height="24" rx="3" fill="#24478a"/>
  <line x1="94" y1="342" x2="386" y2="342" stroke="#41597e" stroke-width="3.5"/>
  <g stroke="#7d92b3" stroke-width="3">
    <line x1="94" y1="370" x2="330" y2="370"/><line x1="94" y1="398" x2="366" y2="398"/>
  </g>
  <rect x="94" y="416" width="204" height="36" fill="#ffffff" stroke="#7d92b3" stroke-width="2"/>
  <g stroke="#243b5e">
    <line x1="322" y1="420" x2="322" y2="448" stroke-width="3"/><line x1="330" y1="420" x2="330" y2="448" stroke-width="1.6"/>
    <line x1="336" y1="420" x2="336" y2="448" stroke-width="4"/><line x1="346" y1="420" x2="346" y2="448" stroke-width="1.6"/>
    <line x1="352" y1="420" x2="352" y2="448" stroke-width="3"/><line x1="362" y1="420" x2="362" y2="448" stroke-width="1.6"/>
    <line x1="368" y1="420" x2="368" y2="448" stroke-width="4"/>
  </g>
  <line x1="94" y1="476" x2="286" y2="476" stroke="#7d92b3" stroke-width="3"/>

  <!-- capture frame -->
  <rect x="54" y="254" width="374" height="274" rx="14" fill="none" stroke="#3ecf8e" stroke-width="5" stroke-dasharray="14 10"/>

  <!-- callouts -->
  <g font-size="17" font-weight="700" fill="#0d1a2e" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="24" y="32">The data plate is on the side panel</text>
    <text x="222" y="96">Look near the pipe</text>
    <text x="222" y="118">connections</text>
    <text x="244" y="248">Get close — fill the frame</text>
    <text x="94" y="548">Model and serial numbers must be readable</text>
  </g>
  <g stroke="#4a5e7a" stroke-width="2.5" fill="none">
    <path d="M218 90 q-26 22 -40 42"/>
    <path d="M118 40 q-24 8 -46 10"/>
  </g>

</svg>
