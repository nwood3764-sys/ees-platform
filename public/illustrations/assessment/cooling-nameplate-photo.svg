<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Cooling nameplate photo guide: the data plate is on the condenser's side
       panel near the service valves — fill the frame with the label. -->
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>

  <!-- condenser, small, at left -->
  <rect x="40" y="90" width="96" height="120" rx="5" stroke="#0d1a2e" stroke-width="2.5"/>
  <circle cx="88" cy="122" r="18" stroke="#0d1a2e" stroke-width="2"/>
  <line x1="88" y1="107" x2="88" y2="137" stroke="#0d1a2e" stroke-width="1.2"/>
  <line x1="73" y1="122" x2="103" y2="122" stroke="#0d1a2e" stroke-width="1.2"/>
  <line x1="50" y1="158" x2="126" y2="158" stroke="#0d1a2e" stroke-width="1.2"/>
  <line x1="50" y1="170" x2="126" y2="170" stroke="#0d1a2e" stroke-width="1.2"/>
  <line x1="50" y1="182" x2="126" y2="182" stroke="#0d1a2e" stroke-width="1.2"/>
  <!-- nameplate location on side panel -->
  <rect x="112" y="140" width="20" height="14" stroke="#7eb3e8" stroke-width="2.5"/>

  <!-- callout -->
  <line x1="132" y1="140" x2="196" y2="52" stroke="#7eb3e8" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="132" y1="154" x2="196" y2="248" stroke="#7eb3e8" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- zoomed nameplate -->
  <rect x="196" y="52" width="176" height="196" rx="6" stroke="#0d1a2e" stroke-width="3"/>
  <line x1="212" y1="84" x2="356" y2="84" stroke="#0d1a2e" stroke-width="2.5"/>
  <line x1="212" y1="108" x2="332" y2="108" stroke="#0d1a2e" stroke-width="2"/>
  <line x1="212" y1="132" x2="356" y2="132" stroke="#0d1a2e" stroke-width="2"/>
  <line x1="212" y1="156" x2="320" y2="156" stroke="#0d1a2e" stroke-width="2"/>
  <rect x="212" y="176" width="144" height="30" stroke="#0d1a2e" stroke-width="1.5"/>
  <line x1="212" y1="222" x2="300" y2="222" stroke="#0d1a2e" stroke-width="2"/>

  <!-- capture frame -->
  <rect x="184" y="40" width="200" height="220" rx="10" stroke="#3ecf8e" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- camera glyph -->
  <g transform="translate(196,218)">
    <rect x="0" y="4" width="34" height="24" rx="4" stroke="#2aab72" stroke-width="2.5" fill="#ffffff"/>
    <circle cx="17" cy="16" r="7" stroke="#2aab72" stroke-width="2.5"/>
    <rect x="11" y="0" width="12" height="6" rx="2" stroke="#2aab72" stroke-width="2.5" fill="#ffffff"/>
  </g>
</svg>
