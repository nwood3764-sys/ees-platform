<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Inter, -apple-system, sans-serif">
  <!-- Cooling nameplate photo guide — colored illustrated style. The data plate
       is on the condenser's side panel near the service valves. -->
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="480" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="480" height="560" fill="#eef4f0"/>

  <g filter="url(#pencil)">
    <!-- condenser, small, upper-left -->
    <rect x="34" y="58" width="140" height="180" rx="9" fill="#e3e9f3" stroke="#243b5e" stroke-width="3.5"/>
    <circle cx="104" cy="112" r="32" fill="#f4f7fb" stroke="#41597e" stroke-width="2.5"/>
    <g stroke="#7d92b3" stroke-width="2">
      <line x1="104" y1="84" x2="104" y2="140"/>
      <line x1="76" y1="112" x2="132" y2="112"/>
      <line x1="84" y1="92" x2="124" y2="132"/>
      <line x1="124" y1="92" x2="84" y2="132"/>
    </g>
    <g stroke="#7d92b3" stroke-width="2">
      <line x1="46" y1="164" x2="162" y2="164"/>
      <line x1="46" y1="180" x2="162" y2="180"/>
      <line x1="46" y1="196" x2="162" y2="196"/>
      <line x1="46" y1="212" x2="162" y2="212"/>
    </g>
    <!-- plate location on the side panel by the service valves -->
    <rect x="140" y="140" width="42" height="30" rx="4" fill="#dcecfb" stroke="#2a6bb0" stroke-width="3.5"/>
    <path d="M174 226 q18 -2 30 -2" stroke="#3a4d68" stroke-width="6" fill="none"/>

    <!-- magnifier -->
    <circle cx="206" cy="182" r="30" fill="none" stroke="#2a6bb0" stroke-width="5"/>
    <line x1="228" y1="204" x2="258" y2="238" stroke="#2a6bb0" stroke-width="7"/>

    <!-- zoomed data plate -->
    <rect x="76" y="272" width="330" height="234" rx="10" fill="#eef3fa" stroke="#243b5e" stroke-width="4"/>
    <rect x="76" y="272" width="330" height="44" rx="10" fill="#c9d8ec"/>
    <line x1="98" y1="302" x2="250" y2="302" stroke="#243b5e" stroke-width="5"/>
    <line x1="98" y1="346" x2="382" y2="346" stroke="#41597e" stroke-width="3.5"/>
    <line x1="98" y1="374" x2="330" y2="374" stroke="#7d92b3" stroke-width="3"/>
    <line x1="98" y1="402" x2="366" y2="402" stroke="#7d92b3" stroke-width="3"/>
    <rect x="98" y="420" width="200" height="34" fill="#ffffff" stroke="#7d92b3" stroke-width="2"/>
    <g stroke="#243b5e">
      <line x1="322" y1="424" x2="322" y2="452" stroke-width="3"/>
      <line x1="330" y1="424" x2="330" y2="452" stroke-width="1.6"/>
      <line x1="336" y1="424" x2="336" y2="452" stroke-width="4"/>
      <line x1="346" y1="424" x2="346" y2="452" stroke-width="1.6"/>
      <line x1="352" y1="424" x2="352" y2="452" stroke-width="3"/>
      <line x1="362" y1="424" x2="362" y2="452" stroke-width="1.6"/>
      <line x1="368" y1="424" x2="368" y2="452" stroke-width="4"/>
    </g>
    <line x1="98" y1="478" x2="286" y2="478" stroke="#7d92b3" stroke-width="3"/>
  </g>

  <!-- capture frame -->
  <rect x="58" y="254" width="366" height="270" rx="14" fill="none" stroke="#3ecf8e" stroke-width="5" stroke-dasharray="14 10"/>

  <!-- labels -->
  <g font-size="17" font-weight="700" fill="#0d1a2e" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="26" y="34">The data plate is on the side panel</text>
    <text x="212" y="120">Look near the pipe</text>
    <text x="212" y="142">connections</text>
    <text x="240" y="248">Get close — fill the frame</text>
    <text x="96" y="548">Model and serial numbers must be readable</text>
  </g>
  <g stroke="#4a5e7a" stroke-width="2.5" fill="none">
    <path d="M208 112 q-14 12 -22 24"/>
    <path d="M120 42 q-20 8 -40 12"/>
  </g>

  <!-- camera badge -->
  <g transform="translate(410,196)">
    <circle cx="26" cy="26" r="26" fill="#3ecf8e"/>
    <rect x="10" y="18" width="32" height="22" rx="4" fill="#ffffff"/>
    <circle cx="26" cy="29" r="7" fill="#3ecf8e"/>
    <rect x="20" y="13" width="12" height="7" rx="2" fill="#ffffff"/>
  </g>
</svg>
