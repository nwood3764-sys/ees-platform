<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Inter, -apple-system, sans-serif">
  <!-- Water heater nameplate photo guide — realistic style. The data label is
       the large sticker on the side of the tank near the controls. -->
  <defs>
    <linearGradient id="wn_tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9daaba"/><stop offset="0.25" stop-color="#e2e8f0"/>
      <stop offset="0.55" stop-color="#f7f9fb"/><stop offset="1" stop-color="#a3afc0"/>
    </linearGradient>
    <linearGradient id="wn_plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fd"/><stop offset="1" stop-color="#dfe9f5"/>
    </linearGradient>
    <filter id="wn_soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="480" height="560" fill="#f2efe8"/>

  <!-- tank, upper-left -->
  <ellipse cx="104" cy="250" rx="70" ry="8" fill="#8d8468" opacity="0.3" filter="url(#wn_soft)"/>
  <path d="M42 92 Q42 60 104 60 Q166 60 166 92 L166 236 Q166 250 104 250 Q42 250 42 236 Z"
        fill="url(#wn_tank)" stroke="#44526a" stroke-width="3"/>
  <path d="M42 92 Q104 108 166 92" fill="none" stroke="#aab6c6" stroke-width="1.8"/>
  <path d="M76 60 L76 42 M132 60 L132 42" stroke="#6a7788" stroke-width="4"/>
  <!-- big label sticker on the tank near the control -->
  <rect x="72" y="112" width="64" height="88" rx="5" fill="url(#wn_plate)" stroke="#2a6bb0" stroke-width="3"/>
  <g stroke="#2a6bb0" stroke-width="2">
    <line x1="80" y1="128" x2="128" y2="128"/><line x1="80" y1="140" x2="120" y2="140"/>
    <line x1="80" y1="152" x2="126" y2="152"/><line x1="80" y1="164" x2="116" y2="164"/>
  </g>
  <!-- gas control valve below the sticker -->
  <rect x="86" y="208" width="38" height="24" rx="4" fill="#dde3ec" stroke="#6a7788" stroke-width="2"/>

  <!-- magnifier -->
  <circle cx="192" cy="164" r="30" fill="#ffffff" opacity="0.35"/>
  <circle cx="192" cy="164" r="30" fill="none" stroke="#2a6bb0" stroke-width="5"/>
  <line x1="214" y1="186" x2="246" y2="218" stroke="#2a6bb0" stroke-width="7" stroke-linecap="round"/>

  <!-- zoomed label -->
  <rect x="72" y="272" width="338" height="238" rx="10" fill="url(#wn_plate)" stroke="#44526a" stroke-width="3"/>
  <circle cx="88" cy="288" r="4" fill="#aab6c8"/><circle cx="394" cy="288" r="4" fill="#aab6c8"/>
  <circle cx="88" cy="494" r="4" fill="#aab6c8"/><circle cx="394" cy="494" r="4" fill="#aab6c8"/>
  <rect x="86" y="284" width="180" height="24" rx="3" fill="#24478a"/>
  <line x1="94" y1="342" x2="386" y2="342" stroke="#41597e" stroke-width="3.5"/>
  <g stroke="#7d92b3" stroke-width="3">
    <line x1="94" y1="370" x2="330" y2="370"/><line x1="94" y1="398" x2="366" y2="398"/>
  </g>
  <rect x="94" y="416" width="204" height="36" fill="#ffffff" stroke="#7d92b3" stroke-width="2"/>
  <g stroke="#243b5e">
    <line x1="322" y1="420" x2="322" y2="448" stroke-width="3"/><line x1="330" y1="420" x2="330" y2="448" stroke-width="1.6"/>
    <line x1="336" y1="420" x2="336" y2="448" stroke-width="4"/><line x1="346" y1="420" x2="346" y2="448" stroke-width="1.6"/>
    <line x1="352" y1="420" x2="352" y2="448" stroke-width="3"/><line x1="362" y1="420" x2="362" y2="448" stroke-width="1.6"/>
    <line x1="368" y1="420" x2="368" y2="448" stroke-width="4"/>
  </g>
  <line x1="94" y1="476" x2="286" y2="476" stroke="#7d92b3" stroke-width="3"/>

  <!-- capture frame -->
  <rect x="54" y="254" width="374" height="274" rx="14" fill="none" stroke="#3ecf8e" stroke-width="5" stroke-dasharray="14 10"/>

  <!-- callouts -->
  <g font-size="17" font-weight="700" fill="#0d1a2e" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="24" y="26">The data label is the big sticker on the tank</text>
    <text x="204" y="96">Usually near the</text>
    <text x="204" y="118">controls or burner</text>
    <text x="244" y="248">Get close — fill the frame</text>
    <text x="94" y="548">Model and serial numbers must be readable</text>
  </g>
  <g stroke="#4a5e7a" stroke-width="2.5" fill="none">
    <path d="M200 90 q-30 14 -56 24"/>
  </g>

  <!-- camera badge -->
  <g transform="translate(410,192)">
    <circle cx="26" cy="26" r="26" fill="#3ecf8e"/>
    <rect x="10" y="18" width="32" height="22" rx="4" fill="#ffffff"/>
    <circle cx="26" cy="29" r="7" fill="#3ecf8e"/>
    <rect x="20" y="13" width="12" height="7" rx="2" fill="#ffffff"/>
  </g>
</svg>
