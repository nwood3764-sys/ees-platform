<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Inter, -apple-system, sans-serif">
  <!-- Water Heating System — full equipment photo guide, colored illustrated style. -->
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="480" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="480" height="474" fill="#f2f0ea"/>
  <rect x="0" y="474" width="480" height="86" fill="#e6e0d2"/>
  <line x1="0" y1="474" x2="480" y2="474" stroke="#b9b09c" stroke-width="3" filter="url(#pencil)"/>

  <g filter="url(#pencil)">
    <!-- flue rising from the draft hood -->
    <rect x="222" y="44" width="26" height="88" fill="#c2cbd8" stroke="#41597e" stroke-width="3"/>
    <path d="M206 132 L264 132 L248 112 L222 112 Z" fill="#cfd9e9" stroke="#41597e" stroke-width="3"/>

    <!-- tank -->
    <rect x="158" y="132" width="154" height="300" rx="42" fill="#e8edf5" stroke="#243b5e" stroke-width="4"/>
    <rect x="158" y="132" width="42" height="300" rx="42" fill="#d4dcea"/>
    <line x1="160" y1="190" x2="310" y2="190" stroke="#9db0ca" stroke-width="2.5"/>
    <line x1="160" y1="382" x2="310" y2="382" stroke="#9db0ca" stroke-width="2.5"/>

    <!-- cold in (sky) / hot out piping -->
    <path d="M196 132 L196 84 L92 84" stroke="#7eb3e8" stroke-width="7" fill="none"/>
    <circle cx="140" cy="84" r="10" fill="#f2c063" stroke="#8a6720" stroke-width="2.5"/>
    <path d="M282 132 L282 66 L400 66" stroke="#b98a2e" stroke-width="7" fill="none"/>

    <!-- T&P valve + discharge tube down the side -->
    <path d="M312 218 L348 218" stroke="#5a6f8e" stroke-width="6"/>
    <rect x="336" y="206" width="22" height="16" rx="3" fill="#f2c063" stroke="#8a6720" stroke-width="2"/>
    <path d="M348 222 L348 440" stroke="#5a6f8e" stroke-width="6"/>

    <!-- burner door + flame glow, drain valve -->
    <rect x="204" y="396" width="62" height="26" rx="5" fill="#f6dfae" stroke="#b98a2e" stroke-width="2.5"/>
    <path d="M216 418 q4 -12 8 0 q4 -10 8 0 q4 -12 8 0 q4 -10 8 0" stroke="#e8a949" stroke-width="3" fill="none"/>
    <circle cx="176" cy="440" r="8" fill="#cfd9e9" stroke="#41597e" stroke-width="2.5"/>

    <!-- gas line + valve -->
    <path d="M158 372 L104 372 L104 452" stroke="#5a6f8e" stroke-width="5" fill="none"/>
    <circle cx="104" cy="404" r="9" fill="#f2c063" stroke="#8a6720" stroke-width="2.5"/>

    <!-- drain pan + floor shadow -->
    <path d="M146 452 L324 452 L332 470 L138 470 Z" fill="#d8d3c6" stroke="#9a927c" stroke-width="3"/>
    <ellipse cx="236" cy="478" rx="130" ry="9" fill="#cfc6b2" opacity="0.7"/>
  </g>

  <!-- capture frame -->
  <rect x="64" y="34" width="356" height="464" rx="14" fill="none" stroke="#3ecf8e" stroke-width="5" stroke-dasharray="14 10"/>

  <!-- labels -->
  <g font-size="17" font-weight="700" fill="#0d1a2e" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="26" y="24">Fit the whole water heater in one shot</text>
    <text x="292" y="46">Vent / flue</text>
    <text x="26" y="126">Water pipes on top</text>
    <text x="356" y="330">Relief valve</text>
    <text x="30" y="512">Gas line</text>
    <text x="230" y="540">Show the base, pan, and floor around it</text>
  </g>
  <g stroke="#4a5e7a" stroke-width="2.5" fill="none">
    <path d="M290 40 q-24 8 -42 16"/>
    <path d="M110 118 q26 -14 52 -22"/>
    <path d="M380 318 q-16 -40 -28 -80"/>
    <path d="M66 504 q16 -34 30 -66"/>
    <path d="M262 532 q-24 -20 -40 -44"/>
  </g>

  <!-- camera badge -->
  <g transform="translate(398,506)">
    <circle cx="26" cy="26" r="26" fill="#3ecf8e"/>
    <rect x="10" y="18" width="32" height="22" rx="4" fill="#ffffff"/>
    <circle cx="26" cy="29" r="7" fill="#3ecf8e"/>
    <rect x="20" y="13" width="12" height="7" rx="2" fill="#ffffff"/>
  </g>
</svg>
