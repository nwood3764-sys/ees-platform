<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Water Heating System — full equipment photo guide: tank, flue, water
       piping, T&P valve, gas line, and the surrounding area. -->
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>

  <!-- floor -->
  <line x1="16" y1="266" x2="384" y2="266" stroke="#8fa0b8" stroke-width="2"/>

  <!-- tank -->
  <rect x="150" y="96" width="100" height="158" rx="26" stroke="#0d1a2e" stroke-width="3"/>
  <line x1="150" y1="130" x2="250" y2="130" stroke="#0d1a2e" stroke-width="1.5"/>
  <line x1="150" y1="222" x2="250" y2="222" stroke="#0d1a2e" stroke-width="1.5"/>
  <!-- burner access + drain -->
  <rect x="182" y="228" width="36" height="18" rx="3" stroke="#0d1a2e" stroke-width="2"/>
  <circle cx="158" cy="250" r="5" stroke="#0d1a2e" stroke-width="2"/>

  <!-- flue up top -->
  <line x1="192" y1="96" x2="192" y2="44" stroke="#0d1a2e" stroke-width="2.5"/>
  <line x1="208" y1="96" x2="208" y2="44" stroke="#0d1a2e" stroke-width="2.5"/>
  <line x1="186" y1="44" x2="214" y2="44" stroke="#0d1a2e" stroke-width="2.5"/>
  <path d="M188 96 L212 96" stroke="#0d1a2e" stroke-width="2.5"/>

  <!-- cold in / hot out piping -->
  <line x1="168" y1="96" x2="168" y2="66" stroke="#0d1a2e" stroke-width="2.5"/>
  <line x1="168" y1="66" x2="96" y2="66" stroke="#0d1a2e" stroke-width="2.5"/>
  <line x1="232" y1="96" x2="232" y2="58" stroke="#0d1a2e" stroke-width="2.5"/>
  <line x1="232" y1="58" x2="312" y2="58" stroke="#0d1a2e" stroke-width="2.5"/>
  <circle cx="128" cy="66" r="6" stroke="#0d1a2e" stroke-width="2"/> <!-- shutoff -->

  <!-- T&P valve + discharge tube -->
  <line x1="250" y1="150" x2="278" y2="150" stroke="#0d1a2e" stroke-width="2.5"/>
  <line x1="278" y1="150" x2="278" y2="240" stroke="#0d1a2e" stroke-width="2.5"/>

  <!-- gas line with valve -->
  <line x1="150" y1="238" x2="108" y2="238" stroke="#0d1a2e" stroke-width="2"/>
  <circle cx="108" cy="238" r="6" stroke="#0d1a2e" stroke-width="2"/>

  <!-- wall hint -->
  <line x1="64" y1="36" x2="64" y2="266" stroke="#8fa0b8" stroke-width="2"/>

  <!-- what to include -->
  <rect x="48" y="28" width="304" height="252" rx="10" stroke="#3ecf8e" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- camera glyph -->
  <g transform="translate(312,242)">
    <rect x="0" y="4" width="34" height="24" rx="4" stroke="#2aab72" stroke-width="2.5" fill="#ffffff"/>
    <circle cx="17" cy="16" r="7" stroke="#2aab72" stroke-width="2.5"/>
    <rect x="11" y="0" width="12" height="6" rx="2" stroke="#2aab72" stroke-width="2.5" fill="#ffffff"/>
  </g>
</svg>
