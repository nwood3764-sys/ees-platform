<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Inter, -apple-system, sans-serif">
  <!-- Heating nameplate photo guide — realistic style. Where the plate lives
       (inside the upper furnace panel) + close-up filling the frame. -->
  <defs>
    <linearGradient id="npcab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aab6c8"/><stop offset="0.2" stop-color="#e8edf4"/>
      <stop offset="0.55" stop-color="#f6f8fb"/><stop offset="1" stop-color="#b3bfd0"/>
    </linearGradient>
    <linearGradient id="npplate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fd"/><stop offset="1" stop-color="#dfe9f5"/>
    </linearGradient>
    <filter id="npsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="480" height="560" fill="#f2efe8"/>

  <!-- furnace, upper-left, upper door removed and leaning -->
  <ellipse cx="104" cy="258" rx="76" ry="8" fill="#8d8468" opacity="0.3" filter="url(#npsoft)"/>
  <rect x="38" y="56" width="124" height="200" rx="7" fill="url(#npcab)" stroke="#44526a" stroke-width="3"/>
  <!-- open upper compartment: dark interior with the plate on the inner wall -->
  <rect x="50" y="72" width="100" height="76" rx="4" fill="#3a4250"/>
  <rect x="64" y="86" width="72" height="48" rx="3" fill="url(#npplate)" stroke="#2a6bb0" stroke-width="3"/>
  <g stroke="#2a6bb0" stroke-width="2">
    <line x1="72" y1="98" x2="128" y2="98"/><line x1="72" y1="108" x2="118" y2="108"/>
    <line x1="72" y1="118" x2="126" y2="118"/>
  </g>
  <!-- removed door leaning against furnace -->
  <path d="M166 118 L206 104 L212 244 L176 256 Z" fill="#dde3ec" stroke="#8894a5" stroke-width="2"/>
  <!-- lower door stays on -->
  <rect x="52" y="160" width="96" height="82" rx="4" fill="#eef1f6" stroke="#8894a5" stroke-width="1.8"/>

  <!-- magnifier -->
  <circle cx="196" cy="196" r="30" fill="#ffffff" opacity="0.35"/>
  <circle cx="196" cy="196" r="30" fill="none" stroke="#2a6bb0" stroke-width="5"/>
  <line x1="218" y1="218" x2="250" y2="250" stroke="#2a6bb0" stroke-width="7" stroke-linecap="round"/>

  <!-- zoomed data plate: silver label, riveted corners -->
  <rect x="72" y="272" width="338" height="238" rx="10" fill="url(#npplate)" stroke="#44526a" stroke-width="3"/>
  <circle cx="88" cy="288" r="4" fill="#aab6c8"/><circle cx="394" cy="288" r="4" fill="#aab6c8"/>
  <circle cx="88" cy="494" r="4" fill="#aab6c8"/><circle cx="394" cy="494" r="4" fill="#aab6c8"/>
  <rect x="86" y="284" width="180" height="24" rx="3" fill="#24478a"/>
  <g stroke="#41597e" stroke-width="3.5"><line x1="94" y1="342" x2="386" y2="342"/></g>
  <g stroke="#7d92b3" stroke-width="3">
    <line x1="94" y1="370" x2="330" y2="370"/><line x1="94" y1="398" x2="366" y2="398"/>
  </g>
  <rect x="94" y="416" width="204" height="36" fill="#ffffff" stroke="#7d92b3" stroke-width="2"/>
  <g stroke="#243b5e">
    <line x1="322" y1="420" x2="322" y2="448" stroke-width="3"/><line x1="330" y1="420" x2="330" y2="448" stroke-width="1.6"/>
    <line x1="336" y1="420" x2="336" y2="448" stroke-width="4"/><line x1="346" y1="420" x2="346" y2="448" stroke-width="1.6"/>
    <line x1="352" y1="420" x2="352" y2="448" stroke-width="3"/><line x1="362" y1="420" x2="362" y2="448" stroke-width="1.6"/>
    <line x1="368" y1="420" x2="368" y2="448" stroke-width="4"/>
  </g>
  <line x1="94" y1="476" x2="286" y2="476" stroke="#7d92b3" stroke-width="3"/>

  <!-- capture frame -->
  <rect x="54" y="254" width="374" height="274" rx="14" fill="none" stroke="#3ecf8e" stroke-width="5" stroke-dasharray="14 10"/>

  <!-- callouts -->
  <g font-size="17" font-weight="700" fill="#0d1a2e" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="24" y="32">The data plate is inside the upper front panel</text>
    <text x="228" y="96">Take the door off or</text>
    <text x="228" y="118">look behind it</text>
    <text x="244" y="248">Get close — fill the frame</text>
    <text x="94" y="548">Model and serial numbers must be readable</text>
  </g>
  <g stroke="#4a5e7a" stroke-width="2.5" fill="none">
    <path d="M224 90 q-30 -2 -56 -2"/>
    <path d="M128 40 q-24 12 -44 20"/>
  </g>

</svg>
