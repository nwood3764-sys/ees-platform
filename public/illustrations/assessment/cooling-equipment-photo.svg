<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Inter, -apple-system, sans-serif">
  <!-- Cooling System — full equipment photo guide. Realistic style: metallic
       gradients, cast shadow, real condenser anatomy. Callouts preserved. -->
  <defs>
    <linearGradient id="ccab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa7ba"/><stop offset="0.16" stop-color="#dfe5ee"/>
      <stop offset="0.5" stop-color="#f3f6fa"/><stop offset="0.86" stop-color="#ccd5e2"/>
      <stop offset="1" stop-color="#a4b0c2"/>
    </linearGradient>
    <linearGradient id="csky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcebf7"/><stop offset="1" stop-color="#eef4f9"/>
    </linearGradient>
    <linearGradient id="csiding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9da"/><stop offset="1" stop-color="#e2dbc8"/>
    </linearGradient>
    <linearGradient id="cgrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2cc"/><stop offset="1" stop-color="#b5cfb1"/>
    </linearGradient>
    <filter id="csoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- scene -->
  <rect x="0" y="0" width="480" height="452" fill="url(#csky)"/>
  <rect x="326" y="34" width="154" height="418" fill="url(#csiding)"/>
  <g stroke="#d3cbb6" stroke-width="2">
    <line x1="326" y1="84" x2="480" y2="84"/><line x1="326" y1="134" x2="480" y2="134"/>
    <line x1="326" y1="184" x2="480" y2="184"/><line x1="326" y1="234" x2="480" y2="234"/>
    <line x1="326" y1="284" x2="480" y2="284"/><line x1="326" y1="334" x2="480" y2="334"/>
    <line x1="326" y1="384" x2="480" y2="384"/>
  </g>
  <line x1="326" y1="34" x2="326" y2="452" stroke="#b8ae94" stroke-width="3"/>
  <rect x="0" y="452" width="480" height="108" fill="url(#cgrass)"/>

  <!-- pad + shadow -->
  <ellipse cx="216" cy="466" rx="150" ry="13" fill="#5f7a5c" opacity="0.35" filter="url(#csoft)"/>
  <path d="M92 448 L330 448 L346 482 L76 482 Z" fill="#d4cfc2" stroke="#9a927c" stroke-width="2"/>
  <path d="M92 448 L330 448 L334 456 L88 456 Z" fill="#e4e0d5"/>

  <!-- condenser -->
  <rect x="116" y="196" width="194" height="256" rx="10" fill="url(#ccab)" stroke="#44526a" stroke-width="3"/>
  <!-- top grille with fan visible beneath -->
  <rect x="124" y="204" width="178" height="18" rx="6" fill="#c6cfdc" stroke="#8894a5" stroke-width="1.5"/>
  <ellipse cx="213" cy="268" rx="62" ry="44" fill="#2f3742"/>
  <g stroke="#c9d1dd" stroke-width="2.4">
    <line x1="151" y1="268" x2="275" y2="268"/><line x1="213" y1="224" x2="213" y2="312"/>
    <line x1="165" y1="240" x2="261" y2="296"/><line x1="261" y1="240" x2="165" y2="296"/>
    <ellipse cx="213" cy="268" rx="62" ry="44" fill="none"/>
    <ellipse cx="213" cy="268" rx="42" ry="30" fill="none"/>
  </g>
  <!-- fan blades under the grille -->
  <g fill="#9fb0c6" opacity="0.85">
    <path d="M213 268 q-30 -22 -14 -34 q16 -8 20 26 Z"/>
    <path d="M213 268 q34 -10 30 8 q-6 16 -34 0 Z"/>
    <path d="M213 268 q-12 32 -28 22 q-12 -10 20 -28 Z"/>
  </g>
  <circle cx="213" cy="268" r="9" fill="#dde3ec" stroke="#8894a5" stroke-width="2"/>
  <!-- coil fins wrap -->
  <rect x="126" y="326" width="174" height="112" fill="#8f9dad"/>
  <g stroke="#77869a" stroke-width="2">
    <line x1="132" y1="326" x2="132" y2="438"/><line x1="144" y1="326" x2="144" y2="438"/>
    <line x1="156" y1="326" x2="156" y2="438"/><line x1="168" y1="326" x2="168" y2="438"/>
    <line x1="180" y1="326" x2="180" y2="438"/><line x1="192" y1="326" x2="192" y2="438"/>
    <line x1="204" y1="326" x2="204" y2="438"/><line x1="216" y1="326" x2="216" y2="438"/>
    <line x1="228" y1="326" x2="228" y2="438"/><line x1="240" y1="326" x2="240" y2="438"/>
    <line x1="252" y1="326" x2="252" y2="438"/><line x1="264" y1="326" x2="264" y2="438"/>
    <line x1="276" y1="326" x2="276" y2="438"/><line x1="288" y1="326" x2="288" y2="438"/>
  </g>
  <rect x="126" y="326" width="174" height="112" fill="none" stroke="#5d6c80" stroke-width="2"/>
  <!-- corner service panel + plate -->
  <rect x="272" y="238" width="34" height="80" rx="4" fill="#dde3ec" stroke="#8894a5" stroke-width="1.8"/>
  <rect x="279" y="252" width="20" height="14" rx="2" fill="#c2cbd8"/>

  <!-- refrigerant lines: insulated suction (black foam) + bare copper -->
  <path d="M306 300 Q346 296 372 296" stroke="#2e3540" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M306 318 Q346 316 372 316" stroke="#b98a52" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M372 296 L372 262" stroke="#2e3540" stroke-width="10" stroke-linecap="round"/>
  <path d="M372 316 L372 262" stroke="#b98a52" stroke-width="4.5"/>

  <!-- disconnect box + conduit -->
  <rect x="352" y="190" width="46" height="64" rx="5" fill="url(#ccab)" stroke="#44526a" stroke-width="2.5"/>
  <rect x="362" y="202" width="26" height="20" rx="2" fill="#eef1f6" stroke="#8894a5" stroke-width="1.5"/>
  <path d="M375 254 L375 296" stroke="#5f6c7f" stroke-width="5"/>

  <!-- grass tufts -->
  <path d="M62 486 q4 -14 8 0 M76 492 q4 -12 8 0 M356 494 q4 -14 8 0 M372 488 q4 -12 8 0 M120 500 q4 -12 8 0" stroke="#6f9a6a" stroke-width="2.5" fill="none"/>

  <!-- capture frame -->
  <rect x="54" y="148" width="376" height="372" rx="14" fill="none" stroke="#3ecf8e" stroke-width="5" stroke-dasharray="14 10"/>

  <!-- callouts -->
  <g font-size="17" font-weight="700" fill="#0d1a2e" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="26" y="32">Step back — whole unit, lines, and wall box</text>
    <text x="28" y="192">Whole outdoor unit</text>
    <text x="314" y="128">Disconnect box</text>
    <text x="300" y="390">Copper lines</text>
    <text x="26" y="544">Show the pad and clearance around the unit</text>
  </g>
  <g stroke="#4a5e7a" stroke-width="2.5" fill="none">
    <path d="M120 198 q10 10 18 20"/>
    <path d="M374 134 q1 22 1 48"/>
    <path d="M338 378 q-10 -26 -18 -50"/>
    <path d="M118 534 q-16 -20 -26 -42"/>
  </g>

</svg>
