<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Inter, -apple-system, sans-serif">
  <!-- Cooling System — full equipment photo guide, colored illustrated style. -->
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="480" height="560" fill="#ffffff"/>
  <!-- sky wash + house wall + ground -->
  <rect x="0" y="0" width="480" height="452" fill="#eef4fa"/>
  <rect x="330" y="40" width="150" height="412" fill="#efece3"/>
  <rect x="0" y="452" width="480" height="108" fill="#dde8dc"/>
  <line x1="0" y1="452" x2="480" y2="452" stroke="#9fb49d" stroke-width="3" filter="url(#pencil)"/>

  <g filter="url(#pencil)">
    <!-- siding lines on the wall -->
    <line x1="330" y1="90" x2="480" y2="90" stroke="#d6d0c0" stroke-width="2"/>
    <line x1="330" y1="140" x2="480" y2="140" stroke="#d6d0c0" stroke-width="2"/>
    <line x1="330" y1="190" x2="480" y2="190" stroke="#d6d0c0" stroke-width="2"/>
    <line x1="330" y1="240" x2="480" y2="240" stroke="#d6d0c0" stroke-width="2"/>
    <line x1="330" y1="290" x2="480" y2="290" stroke="#d6d0c0" stroke-width="2"/>
    <line x1="330" y1="340" x2="480" y2="340" stroke="#d6d0c0" stroke-width="2"/>

    <!-- concrete pad -->
    <path d="M96 452 L328 452 L344 486 L80 486 Z" fill="#d8d3c6" stroke="#9a927c" stroke-width="3"/>

    <!-- condenser cabinet -->
    <rect x="118" y="200" width="190" height="252" rx="10" fill="#e3e9f3" stroke="#243b5e" stroke-width="4"/>
    <rect x="118" y="200" width="190" height="26" rx="10" fill="#cfd9e9"/>
    <!-- fan grille -->
    <circle cx="213" cy="268" r="46" fill="#f4f7fb" stroke="#41597e" stroke-width="3"/>
    <g stroke="#7d92b3" stroke-width="2.5">
      <line x1="213" y1="226" x2="213" y2="310"/>
      <line x1="171" y1="268" x2="255" y2="268"/>
      <line x1="183" y1="238" x2="243" y2="298"/>
      <line x1="243" y1="238" x2="183" y2="298"/>
    </g>
    <path d="M197 258 q16 -14 24 2 q10 14 -6 20 q-16 6 -22 -8 q-4 -10 4 -14 Z" fill="#bccbe2" stroke="#41597e" stroke-width="2"/>
    <!-- coil louvers -->
    <g stroke="#7d92b3" stroke-width="2.5">
      <line x1="132" y1="334" x2="294" y2="334"/>
      <line x1="132" y1="352" x2="294" y2="352"/>
      <line x1="132" y1="370" x2="294" y2="370"/>
      <line x1="132" y1="388" x2="294" y2="388"/>
      <line x1="132" y1="406" x2="294" y2="406"/>
      <line x1="132" y1="424" x2="294" y2="424"/>
    </g>

    <!-- refrigerant lineset to the wall (insulated line thicker + dark) -->
    <path d="M308 300 q40 -4 62 -4 l0 0" stroke="#3a4d68" stroke-width="9" fill="none"/>
    <path d="M308 318 q40 -2 62 -2" stroke="#8fa0b8" stroke-width="4" fill="none"/>

    <!-- disconnect box on the wall -->
    <rect x="356" y="196" width="44" height="62" rx="5" fill="#e3e9f3" stroke="#243b5e" stroke-width="3.5"/>
    <rect x="366" y="208" width="24" height="18" fill="#f4f7fb" stroke="#41597e" stroke-width="2"/>
    <path d="M378 258 L378 296" stroke="#3a4d68" stroke-width="5"/>

    <!-- grass tufts for scale -->
    <path d="M64 486 q4 -14 8 0 M76 490 q4 -12 8 0 M352 492 q4 -14 8 0 M368 488 q4 -12 8 0" stroke="#7ba377" stroke-width="2.5" fill="none"/>
  </g>

  <!-- capture frame -->
  <rect x="56" y="150" width="374" height="368" rx="14" fill="none" stroke="#3ecf8e" stroke-width="5" stroke-dasharray="14 10"/>

  <!-- labels -->
  <g font-size="17" font-weight="700" fill="#0d1a2e" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="26" y="34">Step back — whole unit, lines, and wall box</text>
    <text x="30" y="196">Whole outdoor unit</text>
    <text x="316" y="130">Disconnect box</text>
    <text x="308" y="392">Copper lines</text>
    <text x="26" y="544">Show the pad and clearance around the unit</text>
  </g>
  <g stroke="#4a5e7a" stroke-width="2.5" fill="none">
    <path d="M120 202 q10 8 20 18"/>
    <path d="M376 136 q2 24 2 52"/>
    <path d="M344 380 q-8 -28 -16 -52"/>
    <path d="M120 534 q-14 -20 -24 -40"/>
  </g>

  <!-- camera badge -->
  <g transform="translate(398,26)">
    <circle cx="26" cy="26" r="26" fill="#3ecf8e"/>
    <rect x="10" y="18" width="32" height="22" rx="4" fill="#ffffff"/>
    <circle cx="26" cy="29" r="7" fill="#3ecf8e"/>
    <rect x="20" y="13" width="12" height="7" rx="2" fill="#ffffff"/>
  </g>
</svg>
