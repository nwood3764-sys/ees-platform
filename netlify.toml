# Netlify build configuration.
#
# Environment variables set here are injected into `npm run build` so Vite can
# inline them into the client bundle via import.meta.env.VITE_*.
#
# Why these are in a committed file rather than the Netlify dashboard:
#   1. Vite-exposed env vars (VITE_* prefix) end up inlined in the built JS
#      and are visible to anyone who views the site source. Keeping them in
#      this file is no less secure than putting them in the dashboard — the
#      public surface is identical.
#   2. Committing the config makes the build reproducible and removes the
#      need to manually configure Netlify via the UI.
#
# The Supabase publishable key relies on row-level security to control
# access; possessing the key does not grant access to any data without a
# valid authenticated session. See Supabase → Authentication → Policies.

[build]
  command  = "npm run build:safe"
  publish  = "dist"

[build.environment]
  VITE_SUPABASE_URL      = "https://flyjigrijjjtcsvpgzvk.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_qkmVXJMofrUrSoVA3bhZ2g_XNsdE9lq"
  # Browser Maps JS key for the customer scheduler address autofill (Places +
  # Maps JavaScript API only, HTTP-referrer restricted to the LEAP domains).
  # Public by design — same rationale as the Supabase publishable key above.
  VITE_GOOGLE_MAPS_API_KEY = "AIzaSyCekN5PTYET9x8-99U6QruQoojyeR6eesQ"
  NODE_VERSION           = "20"

# Security response headers applied to every route. Deliberately conservative
# so nothing in the app breaks:
#   - Permissions-Policy allows camera/geolocation for `self` only — the field
#     PWA captures photo evidence and location; third-party access is denied.
#   - The only CSP directive set is `frame-ancestors` (framing control); no
#     default-src/script-src, so scripts/styles/connections are unrestricted —
#     a full strict CSP still needs staging validation before it can go live.
#
# Framing is controlled by a single CSP `frame-ancestors` directive rather than
# X-Frame-Options. XFO can't express an allowlist and can't be reliably
# overridden per-path on Netlify (a global SAMEORIGIN leaks onto sub-paths and
# blanks the Outlook add-in's cross-origin task pane). One site-wide CSP rule
# avoids that: the app is still frameable only by itself, and the Outlook
# add-in task pane (/outlook-addin/*) is frameable by the Microsoft/Outlook
# hosts that load it. No XFO anywhere, so nothing to conflict or merge.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy   = "frame-ancestors 'self' https://outlook.office.com https://outlook.office365.com https://outlook-sdf.office.com https://*.outlook.com https://outlook.live.com https://*.office.com https://*.office365.com https://*.microsoft365.com https://*.cloud.microsoft https://*.microsoft.com;"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy        = "geolocation=(self), camera=(self), microphone=()"

# SPA routing — any unknown path should serve index.html so the React
# router (via AuthGate) can handle it client-side. Real static files (incl.
# everything under /outlook-addin/) are served before this fallback fires.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
