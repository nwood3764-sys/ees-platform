# Netlify build configuration.
#
# Environment variables set here are injected into `npm run build` so Vite can
# inline them into the client bundle via import.meta.env.VITE_*.
#
# Why these are in a committed file rather than the Netlify dashboard:
#   1. Vite-exposed env vars (VITE_* prefix) end up inlined in the built JS
#      and are visible to anyone who views the site source. Keeping them in
#      this file is no less secure than putting them in the dashboard — the
#      public surface is identical.
#   2. Committing the config makes the build reproducible and removes the
#      need to manually configure Netlify via the UI.
#
# The Supabase publishable key relies on row-level security to control
# access; possessing the key does not grant access to any data without a
# valid authenticated session. See Supabase → Authentication → Policies.

[build]
  command  = "npm run build:safe"
  publish  = "dist"
  # Build LEAP only when LEAP changed. This repo also feeds two single-file
  # sites — the Audit Template Builder (audit-template-builder/) and the Income
  # Qualification Builder (income-qualification-builder/) — and Netlify's
  # default is to rebuild every site connected to a repo on every commit
  # regardless of what changed, so a commit to either of those was rebuilding
  # all of LEAP from identical code. Over the 30 days to 2026-08-16: 23 such
  # builds out of 58 commits, at ~15 credits each. The command runs before the
  # build and cancels it for free when nothing outside those two directories
  # changed since LEAP's last build. Exit 0 cancels, anything else builds — so
  # if CACHED_COMMIT_REF is unset and git errors, the build proceeds. It fails
  # toward building, never toward silently skipping.
  ignore   = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)audit-template-builder' ':(exclude)income-qualification-builder'"

[build.environment]
  VITE_SUPABASE_URL      = "https://flyjigrijjjtcsvpgzvk.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_qkmVXJMofrUrSoVA3bhZ2g_XNsdE9lq"
  # Browser Maps JS key for the customer scheduler address autofill (Places +
  # Maps JavaScript API only, HTTP-referrer restricted to the LEAP domains).
  # Public by design — same rationale as the Supabase publishable key above.
  VITE_GOOGLE_MAPS_API_KEY = "AIzaSyCekN5PTYET9x8-99U6QruQoojyeR6eesQ"
  NODE_VERSION           = "20"
  # Netlify secrets scanning flags these VITE_* values because Vite inlines them
  # into the client bundle — but that inlining is the whole point: they are
  # public by design (the Supabase key is the publishable/anon key gated by RLS;
  # the Maps key is an HTTP-referrer-restricted browser key). Without this,
  # every production build fails at the "secrets scanning" stage with
  # "Exposed secrets detected" (exit 2) and nothing deploys. Omitting ONLY these
  # known-public keys keeps scanning ON for any genuinely secret value.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_GOOGLE_MAPS_API_KEY"
  # OMIT_KEYS alone is not enough: Netlify's "smart detection" scans the compiled
  # dist/ bundle for the VALUES of these keys (Vite inlines every VITE_* var into
  # the client bundle by design). Per the build-log guidance, the value-based
  # detector is silenced with SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES (NOT
  # SECRETS_SCAN_OMIT_VALUES). List the exact public strings; smart detection
  # still runs for every other value. Docs: https://ntl.fyi/configure-secrets-scanning
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "https://flyjigrijjjtcsvpgzvk.supabase.co,sb_publishable_qkmVXJMofrUrSoVA3bhZ2g_XNsdE9lq,AIzaSyCekN5PTYET9x8-99U6QruQoojyeR6eesQ"

# Security response headers applied to every route. Deliberately conservative
# so nothing in the app breaks:
#   - Permissions-Policy allows camera/geolocation for `self` only — the field
#     PWA captures photo evidence and location; third-party access is denied.
#   - The only CSP directive set is `frame-ancestors` (framing control); no
#     default-src/script-src, so scripts/styles/connections are unrestricted —
#     a full strict CSP still needs staging validation before it can go live.
#
# Framing is controlled by a single CSP `frame-ancestors` directive rather than
# X-Frame-Options. XFO can't express an allowlist and can't be reliably
# overridden per-path on Netlify (a global SAMEORIGIN leaks onto sub-paths and
# blanks the Outlook add-in's cross-origin task pane). One site-wide CSP rule
# avoids that: the app is still frameable only by itself, and the Outlook
# add-in task pane (/outlook-addin/*) is frameable by the Microsoft/Outlook
# hosts that load it. No XFO anywhere, so nothing to conflict or merge.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy   = "frame-ancestors 'self' https://outlook.office.com https://outlook.office365.com https://outlook-sdf.office.com https://*.outlook.com https://outlook.live.com https://*.office.com https://*.office365.com https://*.microsoft365.com https://*.cloud.microsoft https://*.microsoft.com;"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy        = "geolocation=(self), camera=(self), microphone=()"

# Storage proxy for links printed INTO generated PDFs.
#
# Adobe Acrobat prompts before following any link out of a document, naming the
# host: "This document is trying to connect to: flyjigrijjjtcsvpgzvk.supabase.co
# — If you trust this site, choose Allow." A program reviewer holding an
# official assessment report has no way to answer that honestly about a random
# project ref, so they Block and the evidence link is dead.
#
# The prompt cannot be turned off from inside the PDF — it is the reader's
# setting. What the PDF controls is the hostname it names. Proxying storage
# through LEAP's own domain makes the question answerable, and Acrobat's
# "Remember this action for this site" then makes it a one-time prompt.
#
# status 200 = proxy, not redirect: the bytes are served under our hostname
# rather than bouncing the reader to another one, so there is no second host to
# be asked about. Netlify forwards the query string, which carries the signed
# token — access is governed exactly as before, by the token, not by the path.
#
# MUST stay above the SPA catch-all: rules are matched in order, and /* would
# otherwise swallow this and return index.html for every photo.
[[redirects]]
  from   = "/evidence/*"
  to     = "https://flyjigrijjjtcsvpgzvk.supabase.co/storage/v1/object/sign/:splat"
  status = 200
  force  = true

# Short evidence links printed into generated reports: /f/<token>.
#
# The long signed-URL form above still works, but a reader sees the whole thing:
# Gmail's redirect interstitial prints the full destination, and 500 characters
# of JWT after a hostname looks exactly like a phishing link. /f/<22 chars> is
# one readable line.
#
# The token is resolved by the report-file function, which serves that ONE file
# and nothing else. It is read-only, takes no path from the request, and the
# link can be revoked — none of which a signed URL can do.
#
# Also above the SPA catch-all, for the same reason.
[[redirects]]
  from   = "/f/*"
  to     = "https://flyjigrijjjtcsvpgzvk.supabase.co/functions/v1/report-file/:splat"
  status = 200
  force  = true

# SPA routing — any unknown path should serve index.html so the React
# router (via AuthGate) can handle it client-side. Real static files (incl.
# everything under /outlook-addin/) are served before this fallback fires.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
